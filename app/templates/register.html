{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin-inline:auto">
  <h2>Регистрация</h2>
  {% if error %}<div class="msg bad">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf" value="{{ csrf }}">

    <label><span>Логин — с ним вы будете входить</span>
      <input name="login" value="{{ form.login if form }}" required autofocus
             autocapitalize="none" autocomplete="username" spellcheck="false"
             pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{2,19}" placeholder="например, mdorn"
             style="font-family:var(--mono)"></label>
    <p class="s dim" style="margin:-6px 0 16px">Латиница и цифры, от 3 до 20 символов.</p>

    <div class="row">
      <label><span>Фамилия</span>
        <input name="last_name" value="{{ form.last_name if form }}" required autocomplete="family-name"></label>
      <label><span>Имя</span>
        <input name="first_name" value="{{ form.first_name if form }}" required autocomplete="given-name"></label>
    </div>
    <label style="margin-top:13px"><span>Отчество — по желанию</span>
      <input name="middle_name" value="{{ form.middle_name if form }}"></label>
    <p class="s dim" style="margin:-6px 0 16px">Так вас увидят в игре и в списках.</p>

    <div class="row">
      <label><span>Пароль</span><input type="password" name="password" required minlength="6"
        autocomplete="new-password"></label>
      <label><span>Ещё раз</span><input type="password" name="password2" required
        autocomplete="new-password"></label>
    </div>
    <p class="s dim" style="margin:13px 0">Придумайте новый пароль, не рабочий.</p>

    <button class="primary wide">Создать аккаунт</button>
  </form>
  <p class="s dim center" style="margin-bottom:0">Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
{% endblock %}
