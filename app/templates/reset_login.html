{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin-inline:auto">
  <h2>Новый пароль</h2>
  <p class="s dim">По коду от сисадмина. Действует 30 минут.</p>
  {% if error %}<div class="msg bad">{{ error }}</div>{% endif %}
  <form method="post" action="/login/reset">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label><span>Логин</span>
      <input name="login" required autocapitalize="none" style="font-family:var(--mono)"></label>
    <label><span>Код</span><input name="code" required style="font-family:var(--mono)"></label>
    <div class="row">
      <label><span>Новый пароль</span><input type="password" name="password" required minlength="6"></label>
      <label><span>Ещё раз</span><input type="password" name="password2" required></label>
    </div>
    <button class="primary wide" style="margin-top:13px">Задать пароль</button>
  </form>
</div>
{% endblock %}
