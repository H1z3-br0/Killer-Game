[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "migrations"]

[tool.ruff.lint]
select = [
    "E", "W",    # стиль
    "F",         # неиспользуемое и неопределённое
    "I",         # порядок импортов
    "B",         # типичные ловушки
    "S",         # безопасность (bandit)
    "UP",        # устаревшие конструкции
    "C4",        # лишние генераторы
    "RUF",       # правила самого ruff
]
ignore = [
    "S101",      # assert — нормальная вещь в тестах
    "B008",      # Depends/Form в значениях по умолчанию — идиома FastAPI
    "RUF001",    # кириллица рядом с латиницей: у нас весь интерфейс русский
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]   # пароли-заглушки и random в тестах — норма

[tool.ruff.lint.isort]
known-first-party = ["app"]
