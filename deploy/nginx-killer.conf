# Nginx перед «Киллером». Кладётся в:
#   Linux : /etc/nginx/sites-available/killer  (+ симлинк в sites-enabled)
#   macOS : /opt/homebrew/etc/nginx/servers/killer.conf
#
# Зачем он нужен: убрать «:8000» из адреса, быстро отдавать шрифты и стили,
# поставить заголовки безопасности и получить внятные логи.

upstream killer {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # Свой IP и mDNS-имя. Подставьте адрес сервера.
    server_name killer.local 192.168.1.50 _;

    # Игроки ничего не загружают: большой запрос — это ошибка или атака.
    client_max_body_size 256k;

    access_log /var/log/nginx/killer.access.log;
    error_log  /var/log/nginx/killer.error.log;

    # ─── заголовки безопасности ───
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;          # игру незачем встраивать во фрейм
    add_header Referrer-Policy "same-origin" always;
    # Скрипт у сервиса один и свой; 'unsafe-inline' для стилей нужен из-за
    # style="" в шаблонах, для скриптов — из-за onsubmit="return confirm(...)".
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'" always;

    # ─── статика мимо приложения ───
    # Шрифты, CSS и скрипт лежат файлами: nginx отдаёт их быстрее и с кешем.
    location /static/ {
        alias /var/www/Killer-Game/app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /healthz {
        proxy_pass http://killer;
        access_log off;
    }

    location / {
        proxy_pass http://killer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ВАЖНО: без этих заголовков сервис увидит адрес 127.0.0.1 у всех
        # запросов сразу, и ограничение частоты входов начнёт считать
        # всех игроков одним человеком.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
