name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Тесты и линтер
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Линтер
        run: ruff check .

      - name: Тесты
        run: pytest tests/ -q

      - name: Схема применяется на чистой базе
        run: |
          python - <<'PY'
          import os, tempfile, pathlib
          os.environ["KILLER_DB"] = str(pathlib.Path(tempfile.mkdtemp()) / "ci.db")
          from app import db
          applied = db.migrate()
          assert applied, "миграции не применились"
          assert db.migrate() == [], "миграция применилась повторно"
          print("схема в порядке:", applied)
          PY

  security:
    name: Секреты и зависимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks смотрит всю историю, а не только верхушку

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поиск секретов в истории
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Уязвимости в зависимостях
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict

      - name: В репозиторий не попало лишнее
        run: bash scripts/check-repo.sh
