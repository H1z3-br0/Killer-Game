name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"

jobs:
  tests:
    name: Тесты и линтер
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Тесты
        run: pytest tests/ -q

      - name: Схема на чистой базе
        run: python scripts/check-schema.py

  security:
    name: Секреты и зависимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # секреты ищем по всей истории, а не в верхушке

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поиск секретов в истории
        run: |
          # Запускаем бинарник напрямую: сторонний action строит диапазон
          # «родитель первого коммита..HEAD», которого у нового репозитория нет.
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Уязвимости в зависимостях
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict

      - name: В репозиторий не попало лишнее
        run: |
          bash scripts/check-repo.sh
          bash scripts/check-secrets.sh
